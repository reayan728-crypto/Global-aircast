<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1d2d" />
      <stop offset="100%" stop-color="#050c14" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00b050" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <radialGradient id="touchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b050" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- iOS / Android Smooth Squircle Canvas -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  <rect width="180" height="180" rx="40" fill="none" stroke="#224263" stroke-width="3" />

  <!-- Center Atmospheric Glow -->
  <circle cx="90" cy="90" r="62" fill="url(#touchGlow)" />

  <!-- Orbital Sensor Ring -->
  <circle cx="90" cy="90" r="56" fill="none" stroke="#00b050" stroke-width="4" stroke-dasharray="24 12" opacity="0.85" />

  <!-- Planetary Coordinate Lines -->
  <ellipse cx="90" cy="90" rx="45" ry="20" fill="none" stroke="#1f6feb" stroke-width="2.5" opacity="0.6" />
  <line x1="90" y1="34" x2="90" y2="146" stroke="#1f6feb" stroke-width="2.5" opacity="0.5" stroke-dasharray="6 6" />

  <!-- Dynamic Swirling Clean Air Vectors -->
  <path d="M 45 74 C 62 58, 102 58, 120 70 C 132 78, 128 92, 114 94 C 100 96, 96 86, 106 80" fill="none" stroke="url(#streamGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 50 102 C 68 94, 108 94, 124 106 C 136 114, 130 128, 116 128 C 104 128, 102 118, 110 112" fill="none" stroke="url(#streamGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 62 122 C 78 116, 94 118, 110 128" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" />

  <!-- Satellite Sensor Point -->
  <circle cx="126" cy="56" r="8" fill="#00e5ff" />
  <circle cx="126" cy="56" r="4" fill="#ffffff" />
</svg>
