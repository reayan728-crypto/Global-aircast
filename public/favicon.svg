<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Obsidian Capsule Base -->
    <linearGradient id="favObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f33" />
      <stop offset="50%" stop-color="#081422" />
      <stop offset="100%" stop-color="#03080e" />
    </linearGradient>

    <!-- Primary Foil: Electric Cyan -> Bio Emerald -->
    <linearGradient id="favPrimaryFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="55%" stop-color="#00b050" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Secondary Foil: Azure -> Mint -->
    <linearGradient id="favSecondaryFoil" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="favCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00b050" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#favObsidian)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />

  <!-- Calibrated Isobar Ring -->
  <circle cx="50" cy="50" r="38" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="5 3 14 3" opacity="0.65" />

  <!-- Cardinal Gate Lines -->
  <line x1="50" y1="5" x2="50" y2="12" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="88" x2="50" y2="95" stroke="#00b050" stroke-width="2.5" stroke-linecap="round" />
  <line x1="5" y1="50" x2="12" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="88" y1="50" x2="95" y2="50" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" />

  <!-- Core Ambient Glow -->
  <circle cx="50" cy="50" r="28" fill="url(#favCoreGlow)" />

  <!-- Vortex Airfoils -->
  <path d="M 50 18 C 66 18, 82 32, 82 50 C 82 60, 76 68, 67 69 C 58 70, 53 62, 57 54 C 61 46, 68 45, 66 38 C 64 31, 52 28, 43 32" fill="none" stroke="url(#favPrimaryFoil)" stroke-width="5" stroke-linecap="round" />
  <path d="M 50 82 C 34 82, 18 68, 18 50 C 18 40, 24 32, 33 31 C 42 30, 47 38, 43 46 C 39 54, 32 55, 34 62 C 36 69, 48 72, 57 68" fill="none" stroke="url(#favSecondaryFoil)" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 28 36 C 36 26, 60 25, 68 36 C 74 44, 69 55, 59 55 C 50 55, 47 48, 52 43 C 55 40, 60 41, 58 45" fill="none" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="round" opacity="0.9" />

  <!-- Nucleus Sensor Hub -->
  <circle cx="50" cy="50" r="7" fill="#0c1d2d" stroke="#00e5ff" stroke-width="2.2" />
  <circle cx="50" cy="50" r="3.6" fill="#00e5ff" />
  <circle cx="48" cy="48" r="1.4" fill="#ffffff" />
</svg>
